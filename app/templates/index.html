<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumix DMC-TZ100 Control</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: #18181b; color: #f4f4f5; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 520px 1fr; gap: 24px; max-width: 1400px; margin: auto; }
        .card { background: #27272a; padding: 16px; border-radius: 10px; }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #3f3f46; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .stream-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .stream-box img { width: 100%; height: 100%; object-fit: contain; }
        .fullscreen-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: #fff; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 16px; }
        .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
        button, select { background: #3f3f46; color: #fff; border: none; padding: 9px 13px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; user-select: none; }
        button:hover, select:hover { background: #52525b; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
        .btn-red { background: #dc2626; } .btn-red:hover { background: #b91c1c; }
        .btn-green { background: #16a34a; } .btn-green:hover { background: #15803d; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-height: 70vh; overflow-y: auto; padding-right: 4px; }
        .media-item { position: relative; background: #18181b; padding: 8px; border-radius: 6px; text-align: center; font-size: 13px; border: 2px solid transparent; }
        .media-item.selected { border-color: #2563eb; }
        .media-item input[type="checkbox"] { position: absolute; top: 12px; left: 12px; width: 20px; height: 20px; cursor: pointer; z-index: 2; }
        .media-item img { width: 100%; height: 105px; object-fit: cover; border-radius: 4px; background: #000; margin-bottom: 6px; cursor: pointer; }
        .media-item a { display: inline-block; padding: 6px 10px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; font-size: 12px; }
        #status { font-size: 12px; color: #a1a1aa; font-family: monospace; margin-top: 8px; }

        /* Мобильная адаптация */
        @media (max-width: 900px) {
            body { padding: 10px; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
            .card { padding: 12px; }
            button, select { padding: 11px 12px; font-size: 14px; flex: 1 1 auto; }
            #dynamic-settings select { flex: 1 1 calc(50% - 8px); }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); max-height: none; }
        }
    </style>
</head>
<body>
<div class="grid">
    <div class="card">
        <h2>
            <span>Видоискатель и Управление</span>
            <span id="batt" style="font-size: 14px; color: #fbbf24;"></span>
        </h2>
        <div class="stream-box" id="stream-container">
            <img id="live" alt="Нажмите «1. Подключить камеру»">
            <button class="fullscreen-btn" onclick="toggleFullscreen()" title="На весь экран">⛶</button>
        </div>
        <div class="btns">
            <button class="btn-blue" onclick="connectCam()">1. Подключить камеру</button>
            <button onclick="cmd('recmode')">Режим съемки</button>
        </div>
        <div class="btns">
            <button class="btn-blue" onclick="cmd('capture')">📸 Сделать фото</button>
            <button class="btn-red" onclick="cmd('video_recstart')">🔴 Старт видео</button>
            <button onclick="cmd('video_recstop')">⏹ Стоп видео</button>
        </div>
        <div class="btns" oncontextmenu="return false;">
            <button onpointerdown="cmd('wide-normal')" onpointerup="cmd('zoomstop')" onpointercancel="cmd('zoomstop')">🔍 Зум - (W)</button>
            <button onpointerdown="cmd('tele-normal')" onpointerup="cmd('zoomstop')" onpointercancel="cmd('zoomstop')">🔎 Зум + (T)</button>
        </div>
        <div class="btns" id="dynamic-settings"></div>
        <div id="status">Готов к работе</div>
    </div>

    <div class="card">
        <h2>
            <span>Галерея</span>
            <div style="display: flex; gap: 6px;">
                <button style="font-size: 12px; padding: 6px 10px;" onclick="toggleSelectAll(true)">Выбрать все</button>
                <button style="font-size: 12px; padding: 6px 10px;" onclick="toggleSelectAll(false)">Снять выбор</button>
            </div>
        </h2>
        <div class="btns">
            <button class="btn-blue" onclick="loadFiles(true)">🔄 Загрузить список с флешки</button>
            <button class="btn-green" id="download-selected-btn" onclick="downloadSelected()" style="display: none;">📥 Скачать выбранные (<span id="selected-count">0</span>)</button>
            <span id="file-count" style="width: 100%; font-size: 13px; color: #a1a1aa;"></span>
        </div>
        <div class="gallery" id="gallery"></div>
        <div style="margin-top: 12px;">
            <button id="load-more-btn" onclick="loadFiles(false)" style="display: none; width: 100%;">➕ Загрузить ещё 45 файлов</button>
        </div>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const liveImg = document.getElementById('live');
    let loadedCount = 0;
    const BATCH_SIZE = 45;

    loadMenu();

    async function connectCam() {
        statusEl.innerText = 'Подключение к камере...';
        const r = await fetch('/api/connect', {method: 'POST'});
        const d = await r.json();
        if (d.batt) document.getElementById('batt').innerText = '🔋 ' + d.batt;
        statusEl.innerText = 'Подключено';
        liveImg.src = '/api/stream?t=' + Date.now();
    }

    async function loadMenu() {
        const r = await fetch('/api/menu');
        const data = await r.json();
        if (!data.groups) return;

        const container = document.getElementById('dynamic-settings');
        container.innerHTML = '';

        data.groups.forEach(group => {
            const sel = document.createElement('select');
            sel.innerHTML = `<option value="">${group.title}</option>` +
                group.options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
            sel.onchange = () => { if (sel.value) setParam(group.type, sel.value); };
            container.appendChild(sel);
        });
    }

    async function cmd(c) {
        statusEl.innerText = 'Команда: ' + c;
        await fetch('/api/cmd/' + c, {method: 'POST'});
        if (c === 'recmode') {
            liveImg.src = '/api/stream?t=' + Date.now();
        }
    }

    async function setParam(type, rawVal) {
        const [val, val2] = rawVal.split('|');
        let url = `/api/setting?type=${encodeURIComponent(type)}&value=${encodeURIComponent(val)}`;
        if (val2) url += `&value2=${encodeURIComponent(val2)}`;
        await fetch(url, {method: 'POST'});
        statusEl.innerText = `Установлено: ${type} = ${rawVal}`;
    }

    function toggleFullscreen() {
        const container = document.getElementById('stream-container');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    async function loadFiles(reset = true) {
        const gal = document.getElementById('gallery');
        const moreBtn = document.getElementById('load-more-btn');

        if (reset) {
            loadedCount = 0;
            gal.innerHTML = '';
            liveImg.removeAttribute('src');
        }

        moreBtn.disabled = true;
        statusEl.innerText = 'Чтение флешки...';

        const r = await fetch(`/api/files?offset=${loadedCount}&limit=${BATCH_SIZE}`);
        const data = await r.json();

        if (data.error) {
            statusEl.innerText = 'Ошибка: ' + data.error;
            moreBtn.disabled = false;
            return;
        }

        loadedCount += data.items.length;
        document.getElementById('file-count').innerText = `Всего: ${data.total} (показаны ${loadedCount})`;
        moreBtn.style.display = data.has_more ? 'block' : 'none';
        moreBtn.disabled = false;

        statusEl.innerText = 'Загрузка миниатюр...';
        const thumbQueue = [];

        data.items.forEach(item => {
            const mainFile = item.files[0];
            if (!mainFile) return;

            const el = document.createElement('div');
            el.className = 'media-item';
            el.dataset.url = mainFile.url;
            el.dataset.filename = `${item.title}.${mainFile.ext}`;
            el.dataset.size = mainFile.size || 0;

            const linksHtml = item.files.map(f => {
                const label = f.label || f.ext;
                const dlUrl = `/api/download?url=${encodeURIComponent(f.url)}&filename=${encodeURIComponent(item.title + '.' + f.ext)}&size=${f.size || 0}`;
                return `<a href="${dlUrl}" onclick="event.stopPropagation()">⬇ ${label}</a>`;
            }).join(' ');

            el.innerHTML = `
                <input type="checkbox" onchange="updateSelectedCount()">
                <img data-src="${item.thumb}" alt="${item.title}">
                <div style="margin-bottom: 6px;"><b>${item.title}</b></div>
                <div>${linksHtml}</div>
            `;

            el.onclick = (e) => {
                if (e.target.tagName === 'A') return;
                const chk = el.querySelector('input[type="checkbox"]');
                chk.checked = !chk.checked;
                chk.dispatchEvent(new Event('change'));
            };

            gal.appendChild(el);
            thumbQueue.push(el.querySelector('img'));
        });

        for (const img of thumbQueue) {
            await new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
                img.src = img.dataset.src;
            });
        }
        statusEl.innerText = 'Готово';
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const selected = document.querySelectorAll('.media-item input[type="checkbox"]:checked');
        const btn = document.getElementById('download-selected-btn');
        document.getElementById('selected-count').innerText = selected.length;

        document.querySelectorAll('.media-item').forEach(item => {
            const chk = item.querySelector('input[type="checkbox"]');
            if (chk.checked) item.classList.add('selected');
            else item.classList.remove('selected');
        });

        btn.style.display = selected.length > 0 ? 'inline-block' : 'none';
    }

    function toggleSelectAll(select) {
        document.querySelectorAll('.media-item input[type="checkbox"]').forEach(chk => {
            chk.checked = select;
        });
        updateSelectedCount();
    }

    async function downloadSelected() {
        const selectedItems = document.querySelectorAll('.media-item input[type="checkbox"]:checked');
        if (selectedItems.length === 0) return;

        statusEl.innerText = `Скачивание ${selectedItems.length} файлов...`;

        for (let i = 0; i < selectedItems.length; i++) {
            const item = selectedItems[i].closest('.media-item');
            const url = item.dataset.url;
            const filename = item.dataset.filename;
            const size = item.dataset.size;

            const dlUrl = `/api/download?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(filename)}&size=${size}`;

            const a = document.createElement('a');
            a.href = dlUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            await new Promise(r => setTimeout(r, 400));
        }

        statusEl.innerText = 'Массовое скачивание запущено';
    }
</script>
</body>
</html>
